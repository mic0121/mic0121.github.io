<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Soumission | Michael Demers</title>
    <link rel="stylesheet" href="style.css?v=2026.4">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; }
        
        .contact-header {
            padding: 180px 20px 60px;
            text-align: center;
            background: linear-gradient(to bottom, #111, #050505);
        }

        .contact-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .contact-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--gold, #D4AF37);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .contact-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-style: italic;
            color: #ccc;
            margin-bottom: 30px;
        }

        .email-link {
            color: var(--gold, #D4AF37);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .email-link:hover { border-bottom: 1px solid #D4AF37; }
        
        /* Conteneur de l'iFrame Brevo */
        .brevo-iframe-wrapper {
            margin-top: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .brevo-iframe {
            width: 100%;
            max-width: 580px; /* S'ajuste à la taille du formulaire */
            height: 950px;    /* Hauteur nécessaire pour tout afficher sans défilement */
            border: none;
            background-color: #050505;
        }

        @media (max-width: 768px) {
            .contact-title { font-size: 2rem; }
            .contact-header { padding-top: 140px; }
            .brevo-iframe { height: 1050px; } /* Un peu plus haut sur mobile pour les espaces */
        }
        
        /* FIX LOGO MOBILE */
        @media (max-width: 768px) {
            header .logo, header .nav-left img, .logo a img {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                width: 0 !important;
            }
            .nav-left { display: flex !important; width: auto !important; }
        }
    </style>
</head>

        <div class="nav-right-actions hide-on-mobile">
            <div class="nav-socials-top">
                <a href="https://instagram.com/michaeldemers_" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com/@Michael.demers52" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://facebook.com/michaelmagicien" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://youtube.com/@MichaelDemers52" target="_blank"><i class="fab fa-youtube"></i></a>

        </div>
    </nav>
</header>

<section class="contact-header">

<script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
</script>

</html>
