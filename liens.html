<style>
  :root{
    --bg:#121212;
    --bg-2:#1b1b1b;
    --line:#2c2a25;
    --text:#f3efe6;
    --muted:#a39e92;
    --gold:#c9a24b;
    --gold-hi:#e2c27a;
    --ink:#121212;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 45% at 50% 0%, rgba(201,162,75,.13), transparent 70%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;
    padding:48px 20px calc(32px + env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}

  .logo{
    width:104px;height:104px;border-radius:50%;
    border:1px solid var(--gold);
    background:#1e1e1e;
    display:grid;place-items:center;overflow:hidden;
    box-shadow:0 0 0 6px rgba(201,162,75,.08);
  }
  .logo img{width:100%;height:100%;object-fit:cover}
  .logo span{font-family:"Playfair Display",Georgia,serif;font-size:34px;color:var(--gold)}

  h1{
    font-family:"Playfair Display",Georgia,serif;font-weight:700;
    font-size:30px;letter-spacing:.01em;margin-top:20px;line-height:1.15;
  }
  .role{
    margin-top:8px;color:var(--gold);font-size:12px;
    letter-spacing:.28em;text-transform:uppercase;font-weight:600;
  }
  .sub{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.5;max-width:30ch}

  .links{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:34px}
  .btn{
    display:flex;align-items:center;gap:14px;
    min-height:64px;padding:14px 20px;border-radius:14px;
    text-decoration:none;font-size:17px;font-weight:600;
    border:1px solid var(--line);background:var(--bg-2);color:var(--text);
    transition:transform .15s ease,border-color .15s ease,background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn svg{width:22px;height:22px;flex:none}
  .btn .label{flex:1;text-align:left}
  .btn .label small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
  .btn .arrow{width:18px;height:18px;opacity:.5}
  .btn:hover{border-color:var(--gold)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

  .btn.primary{
    background:linear-gradient(180deg,var(--gold-hi),var(--gold));
    border-color:var(--gold);color:var(--ink);
  }
  .btn.primary .label small{color:rgba(18,18,18,.7)}
  .btn.primary .arrow{opacity:.7}
  .btn .gold{color:var(--gold)}

  .social{display:flex;gap:14px;margin-top:36px}
  .social a{
    width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;
    border:1px solid var(--line);background:var(--bg-2);color:var(--text);
    transition:color .15s ease,border-color .15s ease,transform .15s ease;
  }
  .social a:hover{color:var(--gold);border-color:var(--gold)}
  .social a:active{transform:scale(.94)}
  .social a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
  .social svg{width:22px;height:22px}

  footer{margin-top:40px;font-size:13px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--gold)}
</style>
